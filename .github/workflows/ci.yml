name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Backend Lint & Integration Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexxpass
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: nexxpass_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Code formatting check (rustfmt)
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Clippy static analysis
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: Run backend integration & unit test suite
        run: cargo test --manifest-path backend/Cargo.toml --all-targets
        env:
          DATABASE_URL: postgres://nexxpass:change-me@localhost:5432/nexxpass_sync
          RUST_BACKTRACE: 1
